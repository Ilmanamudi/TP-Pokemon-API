<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemón</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- CSS propio -->
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/png" href="./img/pokeball-favicon.png">
</head>
<body>
  <div class="container my-5 space-logo">

    <!-- Buscador -->
    <div class="row mb-4">
      <div class="col-md-8 offset-md-2 d-flex">
        <input id="pokemonInput" type="text" class="form-control me-2" placeholder="Buscar Pokémon por nombre o ID">
        <button id="searchBtn" class="btn btn-primary">Buscar</button>
        <button id="resetBtn" class="btn btn-secondary ms-2">Lista</button>
        
      </div>
    </div>

    <!-- Spinner -->
    <div id="spinner" class="text-center d-none mb-4">
      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>

    <section>
        <!-- Contenedor de Cards -->
      <div id="pokemonContainer" class="row g-3"></div>
    </section>
  
  </div>

  <!-- Script principal como MÓDULO -->
  <script type="module" src="./js/main.js"></script>
</body>
<footer id="mainFooter" class="text-center py-1">
    <small>&copy; <span id="year"></span> Todos los derechos reservados.</small>
</footer>
</html>
